<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      --btn-solid-color: #2563eb; 
      --secondary-color: #64748b;
      --accent-color: #0f172a;
    }

    /* 全螢幕鎖定 */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; 
    }

    body { 
      font-family: 'Noto Sans TC', sans-serif; 
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.1) 0px, transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1e293b;
      position: relative;
    }

    /* 背景裝飾圓球 */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(29, 78, 216, 0.05));
      border-radius: 50%;
      top: -100px;
      right: -100px;
      z-index: -1;
      filter: blur(50px);
      animation: float 20s infinite alternate;
    }

    @keyframes float {
      from { transform: translate(0, 0); }
      to { transform: translate(-100px, 100px); }
    }

    /* 主要容器 */
    .container-wrapper {
      width: 100%;
      max-width: 650px;
      height: 90vh; 
      z-index: 10;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .has-edit-active .container-wrapper {
      max-width: 95%; 
      transition: max-width 0.5s ease-in-out;
    }

    /* 切換層級 */
    .view-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .view-layer.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }

    .view-layer.exit-up {
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -150%);
    }

    .view-layer.entry-down {
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 50%);
    }

    /* 卡片設計 */
    .search-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .main-title {
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #0f172a 30%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 40px;
      font-size: 1.75rem;
      line-height: 1.4;
    }

    .form-label {
      font-weight: 500;
      margin-left: 6px;
      color: #334155;
      font-size: 0.95rem;
    }

    .form-control {
      border-radius: 16px;
      padding: 14px 20px;
      border: 1.5px solid #e2e8f0;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.25s ease;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      background: white;
      outline: none;
    }

    /* 主要查詢按鈕 */
    .btn-search {
      background-color: var(--btn-solid-color);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-weight: 700;
      font-size: 1.15rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 15px;
      cursor: pointer;
      box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .btn-search:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px -8px rgba(37, 99, 235, 0.4);
      background-color: #3b82f6;
    }

    /* 重新設計的編輯按鈕 */
    .btn-edit-portal {
      background-color: #ffffff;
      color: #1e293b;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      margin-top: 16px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .btn-edit-portal:hover {
      background-color: #f1f5f9;
      border-color: #2563eb;
      color: #2563eb;
      transform: translateY(-2px);
    }

    /* 資料說明連結 */
    .info-link-container {
      text-align: center;
      margin-top: 16px;
    }

    .info-link {
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }

    .info-link:hover {
      color: #2563eb;
      text-decoration: underline;
    }

    /* 結果與編輯層級樣式 */
    .result-card {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      max-height: 85vh; 
    }

    .result-header {
      background: #0f172a;
      color: white;
      padding: 24px 30px;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .info-grid {
      overflow-y: auto;
      flex-grow: 1;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      border-bottom: 1px solid #f1f5f9;
    }

    .loader-container {
      display: none;
      margin-top: 25px;
    }

    .btn-back {
      margin: 15px auto 25px auto;
      display: block;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 24px;
      border-radius: 50px;
      color: #64748b;
      font-size: 0.9rem;
      transition: all 0.3s;
      cursor: pointer;
    }

    .btn-back:hover {
      background: #f1f5f9;
      color: #2563eb;
      border-color: #2563eb;
    }

    .edit-table thead {
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .edit-table th {
      white-space: nowrap;
      background-color: #f1f5f9 !important;
      color: #475569;
      font-size: 0.85rem;
      padding: 12px 8px !important;
    }

    .slogan-alert {
      background-color: #fff4e6;
      border-left: 5px solid #fd7e14;
      color: #856404;
      border-radius: 12px;
    }

    .btn-cell-edit {
      padding: 2px 6px;
      font-size: 0.7rem;
      opacity: 0.6;
      transition: all 0.2s;
    }

    .btn-cell-edit:hover {
      opacity: 1;
      transform: scale(1.05);
    }
    button:disabled {
      cursor: not-allowed;
      filter: grayscale(0.5);
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="container-wrapper">
  <!-- 查詢層：初始狀態為 active (在中心) -->
  <div id="searchLayer" class="view-layer active">
    <div class="search-card">
      <div class="text-center">
        <h2 class="main-title">新北市卡介苗工作人員<br>查詢系統</h2>
      </div>
      
      <div class="mb-4">
        <label class="form-label">姓名</label>
        <input type="text" id="userName" class="form-control" placeholder="請輸入你的姓名">
      </div>
      
      <div class="mb-4">
        <label class="form-label">出生日期</label>
        <input type="date" id="userBirthday" class="form-control">
      </div>
      
      <button onclick="handleSearch()" class="btn-search w-100">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        查詢個人證書效期
      </button>

      <button onclick="handleAnnualSearch()" class="btn-search w-100" style="background-color: #9e68ad; margin-top: 16px;">
        <i data-lucide="user-round-pen" style="width: 20px; height: 20px; stroke-width: 2.5px;"></i>
        查詢年度參訓成績
      </button>

      <!-- 重新設計的編輯入口按鈕 -->
      <button onclick="handleEditView()" class="btn-edit-portal">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        編輯單位內工作人員資料
      </button>

      <!-- 資料說明連結 -->
      <div class="info-link-container">
        <a href="https://drive.google.com/file/d/1P9NOM4qsF_IGH6hxx1ddNzlwg1atZ_2_/view?usp=drive_link" 
           target="_blank" 
           class="info-link">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          各項訓練定義說明
        </a>
      </div>

      <div id="loader" class="loader-container text-center">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-secondary fw-medium">查詢中，請稍後...</p>
      </div>
    </div>
  </div>

  <!-- 結果層：初始狀態為 entry-down (在下方螢幕外) -->
  <div id="resultLayer" class="view-layer entry-down">
    <div id="result" class="result-card">
      <div class="result-header text-center">查詢結果紀錄</div>
      <div class="info-grid" id="resultContent"></div>
      <button onclick="goBack()" class="btn-back">
        ← 重新查詢
      </button>
    </div>
  </div>

  <div id="editLayer" class="view-layer entry-down">
    <div class="result-card">
      <div class="result-header d-flex justify-content-between align-items-center">
        <span>工作人員資料維護</span>
        <div class="d-flex gap-2">
          <!-- 匯出 Excel 按鈕 -->
          <button class="btn btn-sm btn-light" onclick="exportToExcel()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            匯出 Excel
          </button>
          <button class="btn btn-sm btn-light" onclick="openAddModal()">
            ＋ 新增工作人員申請
          </button>
        </div>
      </div>

      <div class="info-grid p-3" id="editTableContainer">
        <!-- 表格動態生成 -->
      </div>

      <button onclick="goBack()" class="btn-back">
        ← 回查詢頁
      </button>
    </div>
  </div>

</div>

<div class="modal fade" id="addStaffModal" tabindex="-1" aria-labelledby="addStaffModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content custom-modal-content" style="border-radius: 24px;">
            
            <!-- Header -->
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="addStaffModalLabel">新增工作人員申請</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Body: 使用 p-4 或 p-5 增加邊距 -->
            <div class="modal-body p-4 p-md-5">
                
                <!-- 重要標語區塊 -->
                <div class="alert slogan-alert d-flex align-items-center mb-4 shadow-sm" role="alert">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0 me-3" viewBox="0 0 16 16">
                        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                    <div>
                        <strong>提醒：</strong> 參加當年度初訓合格者由局端匯入，<span class="text-decoration-underline">無須另外申請</span>。
                    </div>
                </div>

                <!-- Form: 使用 g-4 增加欄位間距 -->
                <form id="addStaffForm" class="row g-4">

                  <div class="col-md-6">
                    <label class="form-label">服務單位</label>
                    <input type="text" class="form-control" id="add_unit" disabled>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">姓名</label>
                    <input type="text" class="form-control" id="add_name" required>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">生日</label>
                    <input type="date" class="form-control" id="add_birthday" required>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">師資統合獲證年度</label>
                    <input type="text" class="form-control" id="add_master_year">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">種子師資獲證年度</label>
                    <input type="text" class="form-control" id="add_seed_year">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">最近一次帶初訓日</label>
                    <input type="date" class="form-control" id="add_last_train">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">技術評價獲證年度</label>
                    <input type="text" class="form-control" id="add_skill_year">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">初訓獲證年度</label>
                    <input type="text" class="form-control" id="add_basic_year">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">目前是否執行業務</label>
                    <select class="form-control" id="add_active">
                      <option value="是">是</option>
                      <option value="否">否</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">未執行業務原因</label>
                    <input type="text" class="form-control" id="add_reason">
                  </div>

                </form>
            </div>

            <!-- Footer: 移除邊框並增加底部間距 -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary shadow-sm" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary shadow-sm" onclick="submitAddStaff()">送出申請</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="cellEditModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius: 20px;">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="cellEditTitle">申請修改</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-secondary small mb-3">對象：<span id="targetStaffName" class="fw-bold text-dark"></span></p>
        <label class="form-label fw-medium" id="cellEditLabel"></label>
        
        <div id="inputContainer">
          </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary rounded-pill px-4" onclick="confirmCellEdit()">確認送出</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// === 全域狀態 ===
  let currentUserContext = {
    unit: "",
    name: "",
    birthday: ""
  };
  let currentUnitStaffData = []; // 暫存單位資料供匯出使用


  function handleSearch() {
    const name = document.getElementById('userName').value.trim();
    const bday = document.getElementById('userBirthday').value;
    const loader = document.getElementById('loader');
    const resultContent = document.getElementById('resultContent');
    const searchLayer = document.getElementById('searchLayer');
    const resultLayer = document.getElementById('resultLayer');

    if (!name || !bday) {
      alert("請完整輸入姓名與選擇生日");
      return;
    }

    // 1. 開始查詢：鎖定按鈕並顯示 Loading
    setButtonsDisabled(true);
    loader.style.display = 'block';

    google.script.run
      .withSuccessHandler(function(dataArray) {
        // 2. 查詢結束：不論成功失敗都要解鎖
        setButtonsDisabled(false);
        loader.style.display = 'none';

        if (!dataArray || dataArray.length === 0) {
          alert("查無此人，請確認姓名與生日是否正確。");
          return;
        }
        // 確保標題是證書查詢
        document.querySelector('#resultLayer .result-header').innerText = "查詢結果紀錄";
        resultContent.innerHTML = "";
        dataArray.forEach(function(item) {
          const itemDiv = document.createElement('div');
          itemDiv.className = "info-item";
          itemDiv.innerHTML = `
            <div class="info-label">${item.label}</div>
            <div class="info-value" style="color: ${item.color}">${item.value}</div>
          `;
          resultContent.appendChild(itemDiv);
        });

        // 動畫切換
        searchLayer.classList.remove('active');
        searchLayer.classList.add('exit-up');
        resultLayer.classList.remove('entry-down');
        resultLayer.classList.add('active');
      })
      .withFailureHandler(function(err) {
        // 3. 處理伺服器端錯誤：解鎖按鈕
        setButtonsDisabled(false);
        loader.style.display = 'none';
        alert("系統發生錯誤：" + err);
      })
      .searchData(name, bday);
  }

  // === 控制所有按鈕與輸入框狀態的函式 ===
  function setButtonsDisabled(status) {
    const buttons = document.querySelectorAll('button');
    const inputs = document.querySelectorAll('input');
    
    buttons.forEach(btn => btn.disabled = status);
    inputs.forEach(input => input.disabled = status);
  }

  // 點「檢視 / 編輯」的完整流程
  function handleEditView() {
    const name = document.getElementById('userName').value.trim();
    const bday = document.getElementById('userBirthday').value;
    const loader = document.getElementById("loader");

    if (!name || !bday) { alert("請先輸入姓名與生日"); return; }
    
    // 1. 開始請求：鎖定按鈕
    setButtonsDisabled(true);
    loader.style.display = "block";

    google.script.run
      .withSuccessHandler(res => {
        // 2. 請求結束：解鎖
        setButtonsDisabled(false);
        loader.style.display = "none";
        
        if (!res) { alert("查無資料"); return; }
        if (res.error === "NOT_ACTIVE") { alert("你已非本業務人員，無權瀏覽"); return; }
        if (res.error === "NOT_FOUND") { alert("查無此人，請確認姓名與生日"); return; }

        currentUserContext = { unit: res.unit, name, birthday: bday };
        currentUnitStaffData = res.list; 
        renderUnitTable(res.list);
        
        const searchLayer = document.getElementById('searchLayer');
        const editLayer = document.getElementById('editLayer');
        
        searchLayer.classList.remove("active");
        searchLayer.classList.add("exit-up");
        editLayer.classList.remove("entry-down");
        editLayer.classList.add("active");
      })
      .withFailureHandler(err => {
        // 3. 錯誤處理：解鎖
        setButtonsDisabled(false);
        loader.style.display = "none";
        alert("系統發生錯誤：" + err);
      })
      .getUnitStaffList(name, bday);
  }

  // 匯出 Excel 功能
  function exportToExcel() {
    // 1. 取得表格元素
    const tableContainer = document.getElementById("editTableContainer");
    const originalTable = tableContainer.querySelector("table");

    if (!originalTable) {
      alert("目前無資料可供匯出");
      return;
    }

    // 2. 複製一份表格節點，避免影響畫面顯示
    const clonedTable = originalTable.cloneNode(true);

    // 3. 移除複製表格中的所有「申請修改」按鈕
    const buttons = clonedTable.querySelectorAll('.btn-cell-edit');
    buttons.forEach(btn => btn.remove());

    try {
      // 4. 將 HTML 表格轉換為工作表
      const worksheet = XLSX.utils.table_to_sheet(clonedTable);
      
      // 5. 建立活頁簿並加入工作表
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "工作人員清單");

      // 6. 產生檔名（單位_日期）
      const dateStr = new Date().toISOString().slice(0, 10);
      const fileName = `${currentUserContext.unit || '新北市'}_工作人員清單_${dateStr}.xlsx`;

      // 7. 下載檔案
      XLSX.writeFile(workbook, fileName);
      
    } catch (e) {
      console.error(e);
      alert("匯出失敗，錯誤訊息：" + e.message);
    }
  }

  // === 欄位型態設定 ===
  const fieldConfig = {
    "姓名": { type: "text" },
    "生日": { type: "date" },
    "師資統合獲證年度": { type: "number" },
    "種子師資獲證年度": { type: "number" },
    "最近一次帶初訓日": { type: "date" },
    "技術評價獲證年度": { type: "number" },
    "初訓獲證年度": { type: "number" },
    "目前是否執行業務": { type: "select", options: ["是", "否"] },
    "未執行業務原因": { type: "text" }
  };

  const displayOnlyFields = [
    "師資年限",
    "施打年限",
    "檢核",
    "建議參訓項目"
  ];

  const editableFields = [
    "服務單位",
    ...Object.keys(fieldConfig),
    ...displayOnlyFields
  ];

  // 暫存當前正在編輯的資訊
  let activeEdit = { targetName: "", field: "", type: "" };

  function renderUnitTable(list) {
    // 進入編輯頁時，動態放大容器
    document.body.classList.add('has-edit-active');
    
    const container = document.getElementById("editTableContainer");
    let html = `
      <div class="table-responsive border">
        <table class="table table-hover align-middle text-center edit-table mb-0">
          <thead>
            <tr>
              ${editableFields.map(f => `<th>${f}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
    `;

    list.forEach(row => {
      html += "<tr>";
      editableFields.forEach(field => {
        const value = row[field] || "";
        html += `<td>`;
        html += `<div>${value}</div>`;
        
        // 只有「非服務單位」才顯示按鈕
        const nonEditableFields = [
          "服務單位",
          "師資年限",
          "施打年限",
          "檢核",
          "建議參訓項目"
        ];

        if (!nonEditableFields.includes(field)) {
          html += `
            <button class="btn btn-outline-primary btn-sm btn-cell-edit mx-auto"
              onclick="openCellEditModal('${row["姓名"]}', '${field}', '${value}')">
              申請修改
            </button>
          `;
        }
        
        html += `</td>`;
      });
      html += "</tr>";
    });

    html += "</tbody></table></div>";
    container.innerHTML = html;
  }


  // 開啟編輯 Modal
  function openCellEditModal(targetName, field, currentValue) {
    const config = fieldConfig[field];
    activeEdit = { targetName, field, type: config.type };
    
    document.getElementById('targetStaffName').innerText = targetName;
    document.getElementById('cellEditLabel').innerText = `請輸入新的「${field}」內容：`;
    
    const container = document.getElementById('inputContainer');
    container.innerHTML = ''; // 清空

    if (config.type === 'select') {
      let selectHtml = `<select id="cellNewValue" class="form-control rounded-pill">`;
      config.options.forEach(opt => {
        const selected = (opt === currentValue) ? 'selected' : '';
        selectHtml += `<option value="${opt}" ${selected}>${opt}</option>`;
      });
      selectHtml += `</select>`;
      container.innerHTML = selectHtml;
    } else {
      // text, date, number
      const inputType = config.type;
      container.innerHTML = `<input type="${inputType}" id="cellNewValue" class="form-control rounded-pill" value="${currentValue}">`;
    }

    const modal = new bootstrap.Modal(document.getElementById('cellEditModal'));
    modal.show();
  }

  // 確認送出編輯請求
  function confirmCellEdit() {
    const newValue = document.getElementById('cellNewValue').value;
    if (!newValue) { alert("請輸入內容"); return; }

    const modalEl = document.getElementById('cellEditModal');
    const confirmBtn = modalEl.querySelector('.btn-primary');
    const cancelBtn = modalEl.querySelector('.btn-light');

    // 暫存原始文字
    const originalText = confirmBtn.innerText;

    // --- 鎖定按鈕 ---
    confirmBtn.disabled = true;
    cancelBtn.disabled = true;
    confirmBtn.innerText = "傳送中...";

    // 定義恢復按鈕的輔助函式
    const restoreButtons = () => {
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
      confirmBtn.innerText = originalText;
    };

    google.script.run
      .withSuccessHandler(() => {
        bootstrap.Modal.getInstance(modalEl).hide();
        alert("請求已送出，待承辦人確認後修改");
        restoreButtons(); // 恢復按鈕狀態
      })
      .withFailureHandler((err) => {
        alert("傳送失敗：" + err);
        restoreButtons(); // 失敗也要恢復，讓使用者能重試
      })
      .addEditCommentByName(
        currentUserContext.unit, 
        activeEdit.targetName, 
        activeEdit.field, 
        newValue, 
        currentUserContext.name
      );
  }

  function openAddModal() {
    document.getElementById("add_unit").value = currentUserContext.unit;
    document.getElementById("addStaffForm").reset();
    document.getElementById("add_unit").value = currentUserContext.unit; // Reset 後再填一次
    const modal = new bootstrap.Modal(document.getElementById("addStaffModal"));
    modal.show();
  }

  function submitAddStaff() {
    const modalEl = document.getElementById('addStaffModal');
    const confirmBtn = modalEl.querySelector('.btn-primary');
    const cancelBtn = modalEl.querySelector('.btn-secondary');
    
    const formData = {
      "服務單位": document.getElementById("add_unit").value,
      "姓名": document.getElementById("add_name").value,
      "生日": document.getElementById("add_birthday").value,
      "師資統合獲證年度": document.getElementById("add_master_year").value,
      "種子師資獲證年度": document.getElementById("add_seed_year").value,
      "最近一次帶初訓日": document.getElementById("add_last_train").value,
      "技術評價獲證年度": document.getElementById("add_skill_year").value,
      "初訓獲證年度": document.getElementById("add_basic_year").value,
      "目前是否執行業務": document.getElementById("add_active").value,
      "未執行業務原因": document.getElementById("add_reason").value,
    };

    if (!formData["姓名"] || !formData["生日"]) { alert("姓名與生日為必填"); return; }

    const originalText = confirmBtn.innerText;

    // --- 鎖定按鈕 ---
    confirmBtn.disabled = true;
    cancelBtn.disabled = true;
    confirmBtn.innerText = "正在發送...";

    const restoreButtons = () => {
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
      confirmBtn.innerText = originalText;
    };

    google.script.run
      .withSuccessHandler(() => {
        bootstrap.Modal.getInstance(modalEl).hide();
        alert("請求已送出，待承辦人確認後新增");
        restoreButtons();
      })
      .withFailureHandler((err) => {
        alert("申請失敗：" + err);
        restoreButtons();
      })
      .sendNewStaffRequest(formData);
  }

  // 輔助函式：切換圖層
  function switchLayer(fromId, toId) {
    document.getElementById(fromId).classList.remove('active');
    document.getElementById(fromId).classList.add('exit-up');
    document.getElementById(toId).classList.remove('entry-down');
    document.getElementById(toId).classList.add('active');
  }

  // 修改 goBack 確保縮回寬度
  function goBack() {
    document.body.classList.remove('has-edit-active');
    const layers = ['resultLayer', 'editLayer'];
    layers.forEach(id => {
      const layer = document.getElementById(id);
      layer.classList.remove('active');
      layer.classList.add('entry-down');
    });
    const searchLayer = document.getElementById('searchLayer');
    searchLayer.classList.remove('exit-up');
    searchLayer.classList.add('active');
  }

//查詢參訓成績
  function handleAnnualSearch() {
    const name = document.getElementById('userName').value.trim();
    const bday = document.getElementById('userBirthday').value;
    const loader = document.getElementById('loader');
    const resultContent = document.getElementById('resultContent');
    const searchLayer = document.getElementById('searchLayer');
    const resultLayer = document.getElementById('resultLayer');

    if (!name || !bday) {
      alert("請完整輸入姓名與選擇生日");
      return;
    }

    setButtonsDisabled(true);
    loader.style.display = 'block';

    google.script.run
      .withSuccessHandler(function(data) {
        setButtonsDisabled(false);
        loader.style.display = 'none';

        if (!data) {
          alert("查無此人，請確認姓名與生日是否正確。");
          return;
        }

        // 修改結果層的標題
        document.querySelector('#resultLayer .result-header').innerText = "年度參訓結果";
        
        // 用來建立分類區塊的輔助函式
        const createSection = (title, items) => {
          let sectionHtml = `<div class="bg-light px-4 py-2 fw-bold" style="color: #475569; font-size: 0.95rem; border-bottom: 1px solid #e2e8f0; border-top: 1px solid #e2e8f0;">${title}</div>`;
          let hasData = false;
          
          items.forEach(item => {
            // 檢查 item.data 是否有值
            if (item.data && item.data.val !== null && item.data.val !== "") {
              hasData = true;
              sectionHtml += `
                <div class="info-item">
                  <div class="info-label">${item.label}</div>
                  <div class="info-value fw-medium" style="color: ${item.data.color};">${item.data.val}</div>
                </div>
              `;
            }
          });

          // 如果該分類完全沒有成績資料
          if (!hasData) {
            sectionHtml += `
              <div class="info-item justify-content-center text-muted" style="background-color: #fafafa;">
                <span style="font-size: 0.9rem;">今年未參訓該項目或成績未公布</span>
              </div>
            `;
          }
          return sectionHtml;
        };

        // 開始組合 HTML
        let html = "";
        
        html += createSection("📘 師資統合", [
          { label: "判讀成績", data: data.master.read },
          { label: "皮內注射技術成績", data: data.master.inject },
          { label: "是否合格", data: data.master.pass }
        ]);

        html += createSection("📗 種子師資", [
          { label: "成績", data: data.seed.score },
          { label: "是否合格", data: data.seed.pass }
        ]);

        html += createSection("📙 技術評價", [
          { label: "判讀成績", data: data.skill.read },
          { label: "判讀成績（補考）", data: data.skill.readMakeup },
          { label: "皮內注射技術成績", data: data.skill.inject },
          { label: "皮內注射技術成績（補考）", data: data.skill.injectMakeup },
          { label: "是否合格", data: data.skill.pass }
        ]);

        resultContent.innerHTML = html;

        // 動畫切換 (使用與原本相同的過渡效果)
        searchLayer.classList.remove('active');
        searchLayer.classList.add('exit-up');
        resultLayer.classList.remove('entry-down');
        resultLayer.classList.add('active');
      })
      .withFailureHandler(function(err) {
        setButtonsDisabled(false);
        loader.style.display = 'none';
        alert("系統發生錯誤：" + err);
      })
      .searchAnnualResults(name, bday);
  }
  lucide.createIcons();
</script>

</body>
